,"질문은 Do나 Does를 앞에 써요. 부정문은 do not이나 does not을 써요. 뒤의 일반동사는 원형으로 써요.","Does she play? · She does not play.","___ she like music?","Does","He does not ___ soccer. (play)","play"],["can과 should","can은 할 수 있다는 뜻이고, should는 하는 게 좋다는 뜻이에요. 뒤에는 동사원형이 와요.","She can swim. · You should rest.","She can ___ fast. (run)","run","You ___ rest. (쉬는 게 좋아요.)","should"],["현재진행형","지금 하고 있는 행동을 말할 때 am, is, are 뒤에 동사-ing를 써요. make → making, run → running처럼 철자가 바뀌기도 해요.","I am reading. · He is running.","He is ___ now. (run)","running","They ___ playing now.","are"],["be동사 과거형","am과 is의 과거형은 was예요. are의 과거형은 were예요.","I was home. · They were home.","She ___ here yesterday.","was","We ___ at school yesterday.","were"],["규칙 과거형","끝에 보통 ed를 붙여요. e로 끝나면 d만 붙여요. study → studied, stop → stopped처럼 철자가 달라지기도 해요.","play → played · like → liked · study → studied · stop → stopped","I ___ soccer yesterday. (play)","played","She ___ yesterday. (study)","studied"],["불규칙 과거형","ed 규칙을 따르지 않는 동사는 원형과 과거형을 짝지어 외워요.","go → went · come → came · see → saw · eat → ate · take → took · give → gave · make → made · have → had · do → did · get → got","We ___ home yesterday. (go)","went","I ___ rice yesterday. (eat)","ate"],["did 질문과 부정문","과거의 질문과 부정문에서는 did 또는 did not 뒤에 동사원형을 써요.","Did you go? · I did not go.","Did she ___ the book? (read)","read","I did not ___ pizza. (eat)","eat"],["미래 표현","앞으로 할 일은 will 뒤에 동사원형을 써서 말할 수 있어요. 예정된 일은 be going to 뒤에 동사원형을 써요.","I will read. · I am going to read.","I ___ read tomorrow. (will 사용)","will","She is going to ___ a cake. (make)","make"],["의문사","사람은 who, 사물이나 내용은 what, 장소는 where, 시간은 when, 이유는 why, 방법은 how로 물어요.","Where do you live? · When did you go?","___ do you live? (장소)","Where","___ is your birthday? (시간)","When"],["전치사","장소를 나타낼 때 in은 안에, on은 표면 위에, under는 아래에, behind는 뒤에라는 뜻이에요.","in the bag · on the desk · under the bed","The pen is ___ the bag. (가방 안에)","in","The cat is ___ the bed. (침대 아래에)","under"],["there is와 there are","무엇이 어디에 있다고 소개할 때 하나는 There is, 여러 개는 There are를 써요.","There is a book. · There are two books.","There ___ a dog here.","is","There ___ two dogs here.","are"],["형용사와 부사","형용사는 사람이나 사물의 특징을, 부사는 동작의 방식이나 빈도 등을 설명해요.","a slow car · She walks slowly. · I often read.","a ___ car (느린)","slow","She walks ___. (천천히)","slowly"],["비교급과 최상급","둘을 비교할 때 보통 er와 than, 셋 이상 중 가장 두드러지는 것을 말할 때 the와 est를 써요. 긴 형용사에는 more와 most를 쓰기도 해요.","tall → taller → tallest · good → better → best","He is ___ than me. (tall)","taller","She is the ___ runner. (good)","best"],["문장 어순과 명령문","기본 문장은 누가, 무엇을 한다, 무엇을 순서로 써요. 명령문은 보통 동사원형으로 시작해요.","I read books. · Open the door. · Do not run.","I ___ books. (읽어요)","read","___ the door. (문을 열어.)","Open"],["동사 세 가지 형태","원형, 과거형, 과거분사를 순서대로 익혀요. 과거분사는 have나 has와 함께 쓰이는 문장에서 만날 수 있어요.","go → went → gone · see → saw → seen · eat → ate → eaten · write → wrote → written","go, went, ___","gone","write, wrote, ___","written"]];

let draftText='', draftRows=[], scanning=false, scanMessage='', engineLoad;
function loadEngine(){
 if(window.Tesseract)return Promise.resolve(window.Tesseract);
 if(!engineLoad)engineLoad=new Promise((resolve,reject)=>{
   const script=document.createElement('script');
   script.src='https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';
   script.onload=()=>resolve(window.Tesseract);
   script.onerror=()=>{engineLoad=null;script.remove();reject(Error('load'))};
   document.head.append(script);
 });
 return engineLoad;
}
async function scanFile(file){
 if(!file||scanning)return;
 scanning=true;let worker;
 function status(text){scanMessage=text;const el=document.getElementById('scanStatus');if(el)el.textContent=text}
 status('영어 인식 도구를 준비하고 있어요.');
 try{
   const engine=await loadEngine();
   worker=await engine.createWorker('eng',1,{logger:event=>{if(event.status==='recognizing text')status('단어 읽는 중 '+Math.round(event.progress*100)+'%')}});

async function pinHash(pin,salt){
 const key=await crypto.subtle.importKey('raw',new TextEncoder().encode(pin),'PBKDF2',false,['deriveBits']);
 const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:new TextEncoder().encode(salt),iterations:120000,hash:'SHA-256'},key,256);
 return Array.from(new Uint8Array(bits),v=>v.toString(16).padStart(2,'0')).join('');
}

function shuffle(values){
  const copy=[...values];
  for(let i=copy.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[copy[i],copy[j]]=[copy[j],copy[i]]}
  return copy;
}

    const ids=index.slice(0,1000).filter(w=>!state.done.includes(w.id)).slice(0,batchSize()).map(w=>w.id);
    const active=lesson&&lesson.position<lesson.ids.length;
    app.innerHTML='<section class="hero"><small>단어 학습</small><h2>'+ (active?'이어서 공부해요':'오늘의 '+ids.length+'단어')+'</h2><p>'+(active?lesson.position+' / '+lesson.ids.length+'단어 완료':(ids.length?index[ids[0]].name+'부터 시작해요.':'모든 단어를 익혔어요.'))+'</p><div id="actions" class="row"></div></section><section><h2>나의 진도</h2><progress max="1000" value="'+state.done.filter(id=>id<1000).length+'"></progress><div class="stats"><div><b>'+state.done.filter(id=>id<1000).length+'</b>익힌 단어<small>전체 1,000개</small></div><div><b>'+state.grammar.length+'</b>완료한 문법<small>전체 26개</small></div><div><b>'+Object.keys(state.review).length+'</b>복습할 단어<small>틀린 단어</small></div></div></section>';
    const actions=document.getElementById('actions');
    if(active)button('이어서 학습',()=>go('lesson'),actions,'primary');
    else if(ids.length)button('학습 시작',()=>start(ids),actions,'primary');
    if(!state.cloudRole)button('기기 연결',()=>go('pair'),actions);
    button('사진 단어장',()=>go('personal'),actions);
    if(Object.keys(state.review).length)button('오답 복습',()=>go('review'),actions);
  }
  if(view==='lesson'){renderLesson();button('저장하고 나가기',()=>go('home'),app,'exit')}
  if(view==='settings')adminScreen();
  if(view==='pair'){app.innerHTML='<section><h2>기기 연결</h2><div id="pairArea"></div></section>';pairing(byId('pairArea'))}
  if(view==='alphabet')renderAlphabet();
  if(view==='words')renderWords();if(view==='personal')notebook();
  if(view==='grammar')renderGrammar();
  if(view==='review'){
    const ids=Object.keys(state.review).map(Number);
    app.innerHTML=`<section><h2>오답 복습</h2><p>${ids.length?'다시 연습할 단어와 틀린 유형을 볼 수 있어요.':'아직 복습할 단어가 없어요.'}</p><div id="actions" class="row"></div><ul>${ids.map(id=>`<li>${index[id].word} · ${state.review[id].join(', ')}</li>`).join('')}</ul></section>`;
    if(ids.length)button(Math.min(batchSize(),ids.length)+'개 다시 풀기',()=>start(ids.slice(0,batchSize()),true),document.getElementById('actions'),'primary');
  }
}
function renderLesson(){
  if(lesson.position===lesson.ids.length){
    app.innerHTML='<section><h2>이번 학습을 마쳤어요</h2><p>오늘 쓴 단어를 소리 내어 한 번 읽어 봐요.</p><div id="actions" class="row"></div></section>';
    const actions=document.getElementById('actions');
    button('오늘의 학습으로',()=>go('home'),actions,'primary');
    button('오답 복습',()=>go('review'),actions);return;
  }
  const word=current();
  const stage=lesson.stage;
  app.innerHTML=`<section class="task"><progress aria-label="회차 진행" max="${lesson.ids.length*4}" value="${lesson.position*4+stage}"></progress><small>${word.name} · ${lesson.position+1}/${lesson.ids.length}단어 · ${stage+1}/4단계</small><h2>${stages[stage]}</h2><div id="exercise"></div><div id="actions" class="row"></div><p id="feedback" class="note" role="status"></p></section>`;
  const exercise=document.getElementById('exercise');
  const actions=document.getElementById('actions');
  if(stage===0){
    exercise.innerHTML=`<div class="word" lang="en">${word.word}</div><p>${word.meaning}</p><p lang="en">${[...word.word].join(' · ')}</p>`;
    button('발음 듣기',()=>say(word.word),actions);
    button('글자 맞추기',nextStage,actions,'primary');return;
  }
  if(stage===1){
    lesson.tiles??=shuffle([...word.word].map((letter,id)=>({letter,id})));
    exercise.innerHTML=`<p>${word.meaning} · 음성을 듣고 글자를 차례대로 골라요.</p><p class="word" lang="en">${lesson.picked.map(item=>item.letter).join('')||'…'}</p><div class="row" id="tiles"></div><p>${lesson.hint?'철자 힌트 '+word.word:''}</p>`;
    for(const tile of lesson.tiles){
      const item=button(tile.letter,()=>{
        lesson.picked.push(tile);
        if(lesson.picked.length===word.word.length){
          if(lesson.picked.map(value=>value.letter).join('')===word.word){if(!lesson.hint)clearFlag(word,'글자 순서');nextStage();return}
          flag(word,'글자 순서');lesson.picked=[];render();result('글자 순서를 다시 맞춰 봐요.');return;
        }
        render();
      },document.getElementById('tiles'),'tile');
      item.disabled=lesson.picked.some(value=>value.id===tile.id);
    }
    button('발음 듣기',()=>say(word.word),actions);
    button('한 글자 지우기',()=>{lesson.picked.pop();render()},actions);
    button('철자 힌트',()=>{lesson.hint=true;flag(word,'글자 순서');render()},actions);return;
  }
  if(stage===2){
    exercise.innerHTML=`<p>${word.meaning} · 영어 철자를 직접 써요.</p><form id="quiz" class="row"><input id="entry" aria-label="영어 철자" autocomplete="off" autocapitalize="off" spellcheck="false" lang="en" required><button class="primary">확인</button></form>`;
    document.getElementById('quiz').onsubmit=event=>{
      event.preventDefault();const field=document.getElementById('entry');
      if(normalized(field.value)!==normalized(word.word)){flag(word,'철자 쓰기');result('발음을 다시 듣고 한 번 더 써 봐요.');field.select();return}
      if(!lesson.hint)clearFlag(word,'철자 쓰기');
      nextStage();
    };
    button('발음 듣기',()=>say(word.word),actions);
    button('첫 글자 힌트',()=>{lesson.hint=true;flag(word,'철자 쓰기');result(`첫 글자는 ${word.word[0]}, 모두 ${word.word.length}글자예요.`)},actions);
    button('철자 보기',()=>{lesson.hint=true;flag(word,'철자 쓰기');result(word.word+' · 다시 가리고 써 봐요.')},actions);
    focusField();return;
  }
  exercise.innerHTML=`<div class="word" lang="en">${word.word}</div><p>뜻을 소리 내어 말한 뒤 고르세요.</p>`;
  const distractors=[...new Set(units[word.unit][1].map(item=>item[1]).filter(value=>value!==word.meaning))];
  for(const meaning of shuffle([word.meaning,...shuffle(distractors).slice(0,3)])){
    button(meaning,event=>{
      if(meaning===word.meaning){clearFlag(word,'뜻');finishWord();return}
      flag(word,'뜻');result('다른 뜻을 골라 봐요.');
    },actions);
  }
}
function renderAlphabet(){
  const letters='ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  const examples='ant bag cat dog egg fish goat hat ice jam kite lion map nose orange pen quiet rain sun tea uncle van wind box yellow zebra'.split(' ');
  const mode=alphabetIndex<26?'pair':'sound';
  const letter=letters[alphabetIndex%26];
  const example=examples[alphabetIndex%26];
  const target=letter.toLowerCase();
  app.innerHTML=`<section><h2>알파벳 ${mode==='pair'?'대소문자 짝짓기':'단어 속 글자와 소리'}</h2><small>${alphabetIndex%26+1} / 26</small><p class="word" lang="en">${mode==='pair'?letter:example.replace(target,'_')}</p><p>${mode==='pair'?'짝이 되는 소문자를 고르세요.':'단어를 듣고 빈칸에 들어갈 글자를 고르세요.'}</p><div id="choices" class="row"></div><p id="feedback" class="note" role="status"></p><div id="actions" class="row"></div></section>`;
  const actions=document.getElementById('actions');
  const choices=document.getElementById('choices');
  const pairs={b:'d',d:'b',p:'q',q:'p',m:'n',n:'m'};
  const distractors=shuffle([...letters.toLowerCase()].filter(value=>value!==target&&value!==pairs[target]));
  const options=shuffle([target,...(pairs[target]?[pairs[target]]:[]),...distractors.slice(0,pairs[target]?1:2)]);
  for(const value of options)button(value,()=>{if(value===target){alphabetIndex=(alphabetIndex+1)%52;render();result('맞았어요. 다음 글자에 도전해 봐요.')}else result('다시 골라 봐요.')},choices,'tile');
  button(mode==='pair'?'글자 이름 듣기':'단어 듣기',()=>say(mode==='pair'?letter:example),actions);
  button('대소문자',()=>{alphabetIndex=0;render()},actions);
  button('단어 속 글자',()=>{alphabetIndex=26;render()},actions);
}
function renderWords(){
  app.innerHTML='<section><h2>주제별 단어장</h2><p>40개 주제 · 주제마다 25단어</p><label for="topic">주제 </label><select id="topic"></select></section><div id="listing"></div>';
  button('사진으로 나만의 단어장 만들기',()=>go('personal'),app.firstElementChild);
  const select=document.getElementById('topic');
  units.forEach(([name],unit)=>select.add(new Option(`${unit+1}. ${name}`,unit)));
  select.value=String(renderWords.unit||0);
  const show=()=>{
    const unit=Number(select.value);renderWords.unit=unit;
    const [name,words]=units[unit];
    const listing=document.getElementById('listing');
    listing.innerHTML=`<section><h2>${name}</h2><div id="sets" class="row"></div><ol>${words.map(([word,meaning],i)=>`<li><span lang="en">${word}</span> · ${meaning}${state.done.includes(unit*25+i)?' · 학습 완료':''}</li>`).join('')}</ol></section>`;
    for(let offset=0;offset<25;offset+=batchSize()){
      const ids=words.slice(offset,offset+batchSize()).map((_,i)=>unit*25+offset+i);
      button((offset+1)+'–'+(offset+ids.length)+'번 연습',()=>start(ids),document.getElementById('sets'));
    }
  };
  select.onchange=show;show();
}
function renderGrammar(){
  const groups=[['명사와 대명사',0,8],['현재와 문장 형태',8,14],['과거와 미래',14,19],['문장 확장과 동사 변화',19,grammar.length]];
  const [title,explain,examples,...items]=grammar[grammarIndex];
  app.innerHTML=`<section><h2>필수 문법</h2><label for="grammar">학습 항목 </label><select id="grammar">${groups.map(([label,from,to])=>`<optgroup label="${label}">${grammar.slice(from,to).map(([name],i)=>`<option value="${from+i}">${from+i+1}. ${name}${state.grammar.includes(from+i)?' · 완료':''}</option>`).join('')}</optgroup>`).join('')}</select></section><section><h2>${title}</h2><p>${explain}</p><p class="sample">${examples}</p><form id="grammarQuiz">${[0,1].map(i=>`<p><label for="g${i}">${items[i*2]}</label></p><p><input id="g${i}" lang="en" autocapitalize="off" autocomplete="off" spellcheck="false" required></p>`).join('')}<button class="primary">정답 확인</button></form><p id="feedback" class="note" role="status"></p><div id="actions" class="row"></div></section>`;
  if(grammarIndex===16||grammarIndex===25){
    app.insertAdjacentHTML('beforeend','<section><details><summary>필수 불규칙 동사 50개</summary><table style="width:100%;text-align:left"><thead><tr><th>원형</th><th>과거형</th><th>과거분사</th></tr></thead><tbody lang="en">'+verbs.map(row=>'<tr>'+row.map(value=>'<td>'+value+'</td>').join('')+'</tr>').join('')+'</tbody></table><p>read의 과거형과 과거분사는 철자가 같고 발음은 red와 같아요.</p></details></section>');
  }
  const select=document.getElementById('grammar');
  select.value=String(grammarIndex);
  select.onchange=()=>{grammarIndex=Number(select.value);render()};
  document.getElementById('grammarQuiz').onsubmit=event=>{
    event.preventDefault();
    const wrong=[0,1].filter(i=>normalized(document.getElementById('g'+i).value)!==normalized(items[i*2+1]));
    if(wrong.length){result(wrong.map(i=>i+1).join(', ')+'번을 다시 풀어 보세요.');return}
    if(!state.grammar.includes(grammarIndex)){state.grammar.push(grammarIndex);recordReport("문법 학습 완료 · "+title+"\n연습 문제 2개 정답")}
    persist();select.selectedOptions[0].textContent=`${grammarIndex+1}. ${title} · 완료`;result('두 문제 모두 맞았어요.');
  };
  const actions=document.getElementById('actions');
  if(grammarIndex+1<grammar.length)button('다음 문법',()=>{grammarIndex++;render()},actions);
  button('정답 보기',()=>result(`1번 ${items[1]} · 2번 ${items[3]}`),actions);
}
if(state.cloudRole==='parent')view='settings';
render();flushReports();
